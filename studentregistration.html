<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration — Hostel Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; overflow-y: auto; }

        :root {
            --bg: #ffffff; --surface: #f8fafc; --border: #e2e8f0;
            --text-main: #0f172a; --text-muted: #64748b;
            --blue: #3b82f6; --blue-hover: #2563eb;
        }

        body {
            font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-main);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; position: relative;
        }

        body::before {
            content: ''; position: fixed; top: -30%; left: -20%; width: 70%; height: 70%;
            background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        .register-container {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            padding: 44px 40px; width: 100%; max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            position: relative; z-index: 1; animation: fadeUp 0.5s ease both;
        }

        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.85rem; text-decoration: none; margin-bottom: 28px; transition: color 0.2s; }
        .back-link:hover { color: var(--text-main); }

        h2 { font-family: 'Syne', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: 6px; }
        .subtitle { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 32px; }

        .field-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 7px; }

        input {
            width: 100%; padding: 12px 16px; background: #fff;
            border: 1px solid var(--border); border-radius: 10px; color: var(--text-main);
            font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: #94a3b8; }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

        .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 44px; }
        .toggle-pw {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: color 0.2s;
        }

        .error-msg { background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; font-size: 0.85rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .error-msg.visible { display: block; }
        .success-msg { background: #d1fae5; border: 1px solid #34d399; color: #065f46; font-size: 0.85rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .success-msg.visible { display: block; }

        button[type="submit"] {
            width: 100%; padding: 13px; background: var(--blue); color: #fff; border: none; border-radius: 10px;
            font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 6px; transition: background 0.2s, transform 0.15s;
        }
        button[type="submit"]:hover { background: var(--blue-hover); transform: translateY(-1px); }

        .footer-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); }
        .footer-link a { color: var(--blue); text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 480px) {
            body { padding: 16px; }
            .register-container { padding: 32px 24px; border-radius: 16px; max-width: 100%; }
            .back-link { margin-bottom: 24px; font-size: 0.8rem; }
            h2 { font-size: 1.4rem; margin-bottom: 4px; }
            .subtitle { font-size: 0.85rem; margin-bottom: 24px; }
            .field-group { margin-bottom: 16px; }
            label { font-size: 0.8rem; margin-bottom: 6px; }
            input { padding: 11px 14px; font-size: 0.9rem; }
            .hint { font-size: 0.7rem; }
            .error-msg, .success-msg { font-size: 0.8rem; padding: 9px 12px; margin-bottom: 14px; }
            button[type="submit"] { padding: 12px; font-size: 0.9rem; margin-top: 4px; }
            .footer-link { font-size: 0.8rem; margin-top: 16px; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h2>Create Account</h2>
        <p class="subtitle">Register to access the Hostel Portal</p>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <form id="registerForm" onsubmit="doRegister(event)">
            <div class="field-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" placeholder="e.g. Amara Okafor" required>
            </div>
            <div class="field-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@university.edu" required>
            </div>
            <div class="field-group">
                <label for="roomNumber">Room Number</label>
                <input type="text" id="roomNumber" placeholder="e.g. A-204" required>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Min. 8 chars, letter + number" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">👁</button>
                </div>
                <p class="hint">At least 8 characters with one letter and one number.</p>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <p class="footer-link">Already have an account? <a href="studentlogin.html">Login here</a></p>
    </div>

    <script>
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
            else { input.type = 'password'; btn.textContent = '👁'; }
        }

        function doRegister(event) {
            event.preventDefault();
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            errorDiv.classList.remove('visible'); successDiv.classList.remove('visible');

            const name = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const room = document.getElementById('roomNumber').value.trim();
            const password = document.getElementById('password').value;

            const nameRegex = /^[a-zA-Z\s]{3,}$/;
            if (!nameRegex.test(name)) { errorDiv.textContent = 'Name must contain only letters and spaces.'; errorDiv.classList.add('visible'); return; }

            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$/;
            if (!passwordRegex.test(password)) { errorDiv.textContent = 'Password needs 8 chars, 1 letter, 1 number.'; errorDiv.classList.add('visible'); return; }

            const users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.find(u => u.email === email)) { errorDiv.textContent = 'Email already exists.'; errorDiv.classList.add('visible'); return; }

            users.push({ name, email, room, password });
            localStorage.setItem('users', JSON.stringify(users));

            successDiv.textContent = '✓ Registration successful! Redirecting...';
            successDiv.classList.add('visible');
            setTimeout(() => window.location.href = 'studentlogin.html', 1500);
        }
    </script>
</body>
</html>
