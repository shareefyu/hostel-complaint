<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Management — Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
            --text-main: #0f172a; --text-muted: #64748b;
            --emerald: #10b981; --emerald-light: #d1fae5;
            --blue: #3b82f6; --amber: #f59e0b; --red: #ef4444;
            --radius: 14px;
        }

        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; }
        
        header {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
            height: 64px; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; }
        .logo span { color: var(--emerald); }
        
        .header-right { display: flex; align-items: center; gap: 16px; }
        
        .admin-info { display: flex; flex-direction: column; text-align: right; line-height: 1.2; }
        .admin-name { font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
        .admin-role { font-size: 0.75rem; color: var(--emerald); font-weight: 600; }
        
        .logout-btn { background: #fee2e2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 8px; padding: 7px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .logout-btn:hover { background: #fecaca; }

        main { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
        
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
        .page-title { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
        .page-sub { color: var(--text-muted); font-size: 0.9rem; }
        
        .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .back-btn:hover { background: #f1f5f9; color: var(--text-main); }
        
        .add-btn { background: var(--emerald); color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .add-btn:hover { background: #059669; }

        .tech-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .tech-table th { background: #f1f5f9; padding: 16px; text-align: left; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .tech-table td { padding: 16px; border-bottom: 1px solid var(--border); }
        .tech-table tr:last-child td { border-bottom: none; }
        .tech-table tr:hover { background: #fafbfc; }

        .spec-badge { display: inline-block; background: var(--emerald-light); color: #047857; padding: 4px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; }
        
        .action-buttons { display: flex; gap: 8px; }
        .btn-small { padding: 6px 12px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-edit { background: var(--blue); color: white; }
        .btn-edit:hover { background: #2563eb; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }
        .btn-delete:hover { background: #fecaca; }

        .empty-state { text-align: center; padding: 60px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
        
        @media (max-width: 768px) {
            main { padding: 24px 16px; }
            .page-header { flex-direction: column; gap: 16px; margin-bottom: 20px; }
            .add-btn { width: 100%; }
            .tech-table { font-size: 0.85rem; }
            .tech-table th, .tech-table td { padding: 12px 8px; }
            .action-buttons { flex-wrap: wrap; gap: 6px; }
            .btn-small { flex: 1; min-width: 60px; }
        }
        
        @media (max-width: 480px) {
            header { padding: 0 16px; }
            main { padding: 16px 12px; }
            .logo { font-size: 0.95rem; }
            .page-title { font-size: 1.1rem; }
            .back-btn { width: 100%; justify-content: center; font-size: 0.8rem; }
            .add-btn { font-size: 0.85rem; padding: 9px 16px; }
            .tech-table { display: block; overflow-x: auto; }
            .tech-table thead { display: none; }
            .tech-table, .tech-table tbody, .tech-table tr, .tech-table td { display: block; width: 100%; }
            .tech-table tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; padding: 12px 0; }
            .tech-table td { border: none; padding: 8px 12px; text-align: left; position: relative; padding-left: 35%; }
            .tech-table td::before { content: attr(data-label); position: absolute; left: 12px; font-weight: 600; width: 30%; color: var(--text-muted); font-size: 0.75rem; }
            .spec-badge { display: block; margin-top: 4px; }
            .action-buttons { display: flex; gap: 6px; }
            .btn-small { padding: 6px 10px; font-size: 0.75rem; flex: 1; }
            .modal-content { width: 95%; padding: 24px 18px; }
            .modal-header { font-size: 1.1rem; }
            .form-group input, .form-group select { font-size: 0.88rem; padding: 10px; }
            .form-actions { flex-direction: column; }
            .btn-save, .btn-cancel { width: 100%; }
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--surface); border-radius: var(--radius); padding: 32px; max-width: 500px; width: 90%; box-shadow: 0 20px 25px rgba(0,0,0,0.15); }
        .modal-header { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
        
        .form-actions { display: flex; gap: 12px; margin-top: 24px; }
        .btn-save { flex: 1; background: var(--emerald); color: white; padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-save:hover { background: #059669; }
        .btn-cancel { flex: 1; background: #f1f5f9; color: var(--text-main); padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-cancel:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Hostel<span>Admin</span></div>
        <div class="header-right">
            <div class="admin-info">
                <div class="admin-name" id="displayAdminName">Loading...</div>
                <div class="admin-role" id="displayAdminRole">Administrator</div>
            </div>
            <button class="logout-btn" onclick="logoutAdmin()">Sign Out</button>
        </div>
    </header>
    
    <main>
        <div style="margin-bottom: 28px;">
            <a href="adminportal.html" class="back-btn">← Back to Complaints</a>
        </div>
        
        <div class="page-header">
            <div>
                <div class="page-title">Technician Management</div>
                <div class="page-sub">Add, edit, and manage maintenance staff members</div>
            </div>
            <button class="add-btn" onclick="openAddModal()">+ Add Technician</button>
        </div>
        
        <div id="technicians-container"></div>
    </main>

    <!-- Add/Edit Technician Modal -->
    <div class="modal" id="technicianModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add Technician</div>
            <form id="technicianForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="techName" placeholder="e.g., John Plumber" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="techEmail" placeholder="e.g., john@hostel.local" required>
                </div>
                <div class="form-group">
                    <label>Specialization</label>
                    <select id="techSpec" required>
                        <option value="">-- Select Specialization --</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Carpentry">Carpentry</option>
                        <option value="HVAC Systems">HVAC Systems</option>
                        <option value="General Maintenance">General Maintenance</option>
                        <option value="Painting">Painting</option>
                        <option value="Locksmith">Locksmith</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="techPassword" placeholder="Set a secure password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-save">Save Technician</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ── Auth Guard
        const authAdmin = JSON.parse(sessionStorage.getItem('authAdmin'));
        if (!authAdmin) {
            window.location.href = 'adminlogin.html';
        } else {
            document.getElementById('displayAdminName').textContent = authAdmin.name;
            document.getElementById('displayAdminRole').textContent = authAdmin.department || 'System Admin';
        }

        let currentEditingId = null;

        function getTechnicians() {
            return JSON.parse(localStorage.getItem('technicians')) || [];
        }

        function saveTechnicians(techs) {
            localStorage.setItem('technicians', JSON.stringify(techs));
        }

        function openAddModal() {
            currentEditingId = null;
            document.getElementById('modalTitle').textContent = 'Add Technician';
            document.getElementById('technicianForm').reset();
            document.getElementById('techPassword').required = true;
            document.getElementById('technicianModal').classList.add('active');
        }

        function openEditModal(id) {
            const techs = getTechnicians();
            const tech = techs.find(t => t.id === id);
            
            if (tech) {
                currentEditingId = id;
                document.getElementById('modalTitle').textContent = 'Edit Technician';
                document.getElementById('techName').value = tech.name;
                document.getElementById('techEmail').value = tech.email;
                document.getElementById('techSpec').value = tech.specialization;
                document.getElementById('techPassword').value = tech.password;
                document.getElementById('techPassword').required = false;
                document.getElementById('techPassword').placeholder = 'Leave blank to keep current password';
                document.getElementById('technicianModal').classList.add('active');
            }
        }

        function closeModal() {
            document.getElementById('technicianModal').classList.remove('active');
            currentEditingId = null;
        }

        function saveTechnician() {
            const name = document.getElementById('techName').value.trim();
            const email = document.getElementById('techEmail').value.trim();
            const spec = document.getElementById('techSpec').value;
            const password = document.getElementById('techPassword').value;

            if (!name || !email || !spec) {
                alert('Please fill in all required fields');
                return;
            }

            const techs = getTechnicians();

            if (currentEditingId === null) {
                // Adding new technician
                if (!password) {
                    alert('Password is required for new technicians');
                    return;
                }
                const newId = Math.max(...techs.map(t => t.id), 0) + 1;
                techs.push({ id: newId, name, email, specialization: spec, password });
            } else {
                // Editing existing technician
                const idx = techs.findIndex(t => t.id === currentEditingId);
                if (idx !== -1) {
                    techs[idx].name = name;
                    techs[idx].email = email;
                    techs[idx].specialization = spec;
                    if (password) techs[idx].password = password;
                }
            }

            saveTechnicians(techs);
            closeModal();
            renderTechnicians();
        }

        function deleteTechnician(id) {
            if (confirm('Are you sure you want to delete this technician?')) {
                const techs = getTechnicians();
                const filtered = techs.filter(t => t.id !== id);
                saveTechnicians(filtered);
                renderTechnicians();
            }
        }

        function renderTechnicians() {
            const container = document.getElementById('technicians-container');
            const techs = getTechnicians();

            if (techs.length === 0) {
                container.innerHTML = `<div class="empty-state"><h3>No Technicians</h3><p>Start by adding your first technician to the system.</p></div>`;
                return;
            }

            const table = `
                <table class="tech-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Specialization</th>
                            <th>Assigned Tasks</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${techs.map(t => `
                            <tr>
                                <td><strong>${t.name}</strong></td>
                                <td>${t.email}</td>
                                <td><span class="spec-badge">${t.specialization}</span></td>
                                <td>${getTaskCount(t.id)}</td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-small btn-edit" onclick="openEditModal(${t.id})">Edit</button>
                                        <button class="btn-small btn-delete" onclick="deleteTechnician(${t.id})">Delete</button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            container.innerHTML = table;
        }

        function getTaskCount(techId) {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            let count = 0;

            users.forEach(user => {
                const userComplaints = JSON.parse(localStorage.getItem('complaints_' + user.email)) || [];
                userComplaints.forEach(c => {
                    const assignmentData = JSON.parse(localStorage.getItem('request_tech_' + c.id));
                    if (assignmentData && assignmentData.techId === techId) {
                        count++;
                    }
                });
            });

            return count;
        }

        function logoutAdmin() {
            sessionStorage.removeItem('authAdmin');
            window.location.href = 'index.html';
        }

        // Event listener
        document.getElementById('technicianForm').addEventListener('submit', function(e) {
            e.preventDefault();
            saveTechnician();
        });

        // Initialize
        renderTechnicians();
    </script>
</body>
</html>
