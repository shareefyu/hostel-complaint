<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration — Hostel Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; overflow-y: auto; }

        :root {
            --bg: #ffffff; --surface: #f8fafc; --border: #e2e8f0;
            --text-main: #0f172a; --text-muted: #64748b;
            --emerald: #10b981; --emerald-hover: #059669;
        }

        body {
            font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-main);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; position: relative;
        }

        body::before {
            content: ''; position: fixed; top: -30%; left: -20%; width: 70%; height: 70%;
            background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        .register-container {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            padding: 44px 40px; width: 100%; max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            position: relative; z-index: 1; animation: fadeUp 0.5s ease both;
        }

        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 0.85rem; text-decoration: none; margin-bottom: 28px; transition: color 0.2s; }
        .back-link:hover { color: var(--text-main); }

        h2 { font-family: 'Syne', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: 6px; }
        .subtitle { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 32px; }

        .field-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 7px; }

        input {
            width: 100%; padding: 12px 16px; background: #fff; border: 1px solid var(--border);
            border-radius: 10px; color: var(--text-main); font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: #94a3b8; }
        input:focus { border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }

        .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 44px; }
        .toggle-pw {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: color 0.2s;
        }

        .error-msg { background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; font-size: 0.85rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .error-msg.visible { display: block; }
        .success-msg { background: #d1fae5; border: 1px solid #34d399; color: #065f46; font-size: 0.85rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .success-msg.visible { display: block; }

        button[type="submit"] {
            width: 100%; padding: 13px; background: var(--emerald); color: #fff; border: none; border-radius: 10px;
            font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 6px; transition: background 0.2s, transform 0.15s;
        }
        button[type="submit"]:hover { background: var(--emerald-hover); transform: translateY(-1px); }

        .footer-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); }
        .footer-link a { color: var(--emerald); text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="register-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h2>Admin Registration</h2>
        <p class="subtitle">Create an authorized administrator account</p>
        
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <form id="registerForm" onsubmit="doAdminRegister(event)">
            <div class="field-group">
                <label for="username">Admin Full Name</label>
                <input type="text" id="username" placeholder="e.g. David Johnson" required>
            </div>
            <div class="field-group">
                <label for="email">Official Email Address</label>
                <input type="email" id="email" placeholder="admin@university.edu" required>
            </div>
            <div class="field-group">
                <label for="department">Department/Role</label>
                <input type="text" id="department" placeholder="e.g. Housing Office" required>
            </div>
            <div class="field-group">
                <label for="password">Admin Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Min. 8 chars, letter + number" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">👁</button>
                </div>
                <p class="hint">At least 8 characters with one letter and one number.</p>
            </div>
            <button type="submit">Create Admin Account</button>
        </form>
        
        <p class="footer-link">Already an admin? <a href="adminlogin.html">Login here</a></p>
    </div>

    <script>
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
            else { input.type = 'password'; btn.textContent = '👁'; }
        }

        function doAdminRegister(event) {
            event.preventDefault();
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            errorDiv.classList.remove('visible'); successDiv.classList.remove('visible');

            const name = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const department = document.getElementById('department').value.trim();
            const password = document.getElementById('password').value;

            const nameRegex = /^[a-zA-Z\s]{3,}$/;
            if (!nameRegex.test(name)) { errorDiv.textContent = 'Name must contain only letters and spaces.'; errorDiv.classList.add('visible'); return; }

            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$/;
            if (!passwordRegex.test(password)) { errorDiv.textContent = 'Password needs 8 chars, 1 letter, 1 number.'; errorDiv.classList.add('visible'); return; }

            // Store in a separate 'admins' array
            const admins = JSON.parse(localStorage.getItem('admins')) || [];
            if (admins.find(a => a.email === email)) { errorDiv.textContent = 'An admin with this email already exists.'; errorDiv.classList.add('visible'); return; }

            admins.push({ name, email, department, password });
            localStorage.setItem('admins', JSON.stringify(admins));

            successDiv.textContent = '✓ Admin registration successful! Redirecting...';
            successDiv.classList.add('visible');
            setTimeout(() => window.location.href = 'adminlogin.html', 1500);
        }
    </script>
</body>
</html>
